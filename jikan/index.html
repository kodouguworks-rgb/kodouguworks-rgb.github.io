<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>時間とできたこと</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#222222"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<style>
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 -apple-system,"Hiragino Sans",sans-serif;background:#f4f4f2;color:#222}

.card{background:#fff;border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 1px 2px #0002}
.intro{background:#fff8e1;border:1px solid #e6c200}
.top{display:flex;justify-content:space-between;align-items:baseline}

button{font:inherit;min-height:48px;border:0;border-radius:12px;padding:8px 14px;background:#e4e4e0;color:#222}
.big-b{display:block;width:100%;min-height:64px;font-size:19px;font-weight:700;margin:8px 0;color:#fff;text-align:left;padding:10px 16px}
.t-span{background:#2b6cb0}.t-fixed{background:#2f855a}.t-count{background:#8a5a0a}.t-note{background:#6b46c1}

.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #ccc;display:flex;max-width:480px;margin:0 auto}

</style></head><body><div id="app"></div>
<script>
/* ===== 計算（純粋関数）ここから ===== */
var TYPES={span:'使った時間をはかる',fixed:'決めた時間をはかる',count:'回数を数える',note:'できたことを書く'};
var EXAMPLE={span:'副業',fixed:'勉強',count:'解いた問題',note:'できたこと'};
function uid(){return Math.random().toString(36).slice(2,9);}
function p2(n){return (n<10?'0':'')+n;}
function dayStart(ms){var d=new Date(ms);return new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();}
function dayEnd(ms){var d=new Date(ms);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+1).getTime();}
function ymd(ms){var d=new Date(ms);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function fmtHMS(ms){ms=Math.max(0,Math.floor(ms/1000));return p2(Math.floor(ms/3600))+':'+p2(Math.floor(ms%3600/60))+':'+p2(ms%60);}
function fmtHM(ms){var m=Math.floor(ms/60000),h=Math.floor(m/60);return h>0?h+'時間'+p2(m%60)+'分':m+'分';}
function newState(){return{v:3,kinds:[{id:'k1',type:'span',name:'副業',hidden:false},{id:'k2',type:'fixed',name:'勉強',minutes:25,hidden:false},{id:'k3',type:'note',name:'できたこと',hidden:false}],entries:[],counts:[],notes:[]};}
function unitOf(k){return (k&&k.unit)||'回';}
function cleanUnit(u){u=String(u==null?'':u).trim();return u?u.slice(0,4):'回';}
function previewLabel(type,name,minutes){name=String(name||'').trim()||'（名前）';if(type==='fixed')return name+'を'+(parseInt(minutes,10)||'◯')+'分始める';if(type==='count')return name+'　＋1';if(type==='note')return name+'を書く';return name+'をはかる';}
function setMinutes(st,id,m){m=parseInt(m,10);if(!(m>=1&&m<=240))return false;var ok=false;st.kinds.forEach(function(k){if(k.id===id&&k.type==='fixed'){k.minutes=m;ok=true;}});return ok;}
function setUnit(st,id,u){var ok=false;st.kinds.forEach(function(k){if(k.id===id&&k.type==='count'){k.unit=cleanUnit(u);ok=true;}});return ok;}
function fixedLens(st,kindId,ds,now){var de=dayEnd(ds),o=[];st.entries.forEach(function(e){if(e.kind===kindId&&e.full&&e.end>=ds&&e.end<de)o.push(Math.round((e.end-e.start)/60000));});return o;}
function fixedLine(st,k,ds,now,v){if(!v||v.ms<60000&&!v.times)return '';var L=fixedLens(st,k.id,ds,now);if(!L.length)return fmtHM(v.ms);var same=L.every(function(x){return x===L[0];});return (same?L[0]+'分 × '+L.length+'回':L.length+'回')+'（計'+fmtHM(v.ms)+'）';}
function addKind(st,type,name,minutes,unit){name=String(name||'').trim();if(!TYPES[type])return'種類を選んでください';if(!name)return'名前を入れてください';if(name.length>12)return'名前は12字までです';
  if(type==='fixed'){minutes=parseInt(minutes,10);if(!(minutes>=1&&minutes<=240))return'長さは1〜240分で入れてください';}
  var k={id:'k'+uid(),type:type,name:name,hidden:false};if(type==='fixed')k.minutes=minutes;if(type==='count')k.unit=cleanUnit(unit);st.kinds.push(k);return null;}
function kindOf(st,id){for(var i=0;i<st.kinds.length;i++)if(st.kinds[i].id===id)return st.kinds[i];return{id:id,type:'span',name:'（消した記録）'};}
function runningEntry(st){for(var i=0;i<st.entries.length;i++)if(st.entries[i].end==null)return st.entries[i];return null;}
/* はかる物を押す。動いている物があれば先に終える。同じ物なら終えるだけ。返り値＝終えた記録（なければ null） */
function pressTimed(st,kindId,now){var r=runningEntry(st),ended=null;
  if(r){r.end=Math.max(now,r.start);r.full=false;ended=r;}
  if(r&&r.kind===kindId)return{ended:ended,started:null};
  var k=kindOf(st,kindId),e={id:uid(),kind:kindId,start:now,end:null,full:false};if(k.type==='fixed')e.planned=k.minutes;
  st.entries.push(e);return{ended:ended,started:e};}
/* 決めた時間が過ぎていれば、決めた長さで終えた事にする。返り値＝{entry,lateMin} か null */
function finishDue(st,now){var r=runningEntry(st);if(!r||!r.planned)return null;var due=r.start+r.planned*60000;if(now<due)return null;r.end=due;r.full=true;return{entry:r,lateMin:Math.floor((now-due)/60000)};}
function pressCount(st,kindId,now){st.counts.push({id:uid(),kind:kindId,at:now});}
function undoCount(st,kindId,now){for(var i=st.counts.length-1;i>=0;i--){if(st.counts[i].kind===kindId){if(now-st.counts[i].at<=60000){st.counts.splice(i,1);return true;}return false;}}return false;}
function addNote(st,text,now,kindId,entryId){text=String(text||'').trim();if(!text)return false;st.notes.push({id:uid(),at:now,text:text.slice(0,200),kind:kindId||null,entry:entryId||null});return true;}
function clipMs(e,ds,de,now){var s=Math.max(e.start,ds),t=Math.min(e.end==null?now:e.end,de,now);return Math.max(0,t-s);}
/* ある日の、記録ごとの 時間・回数(決めた時間を終えた回)・数えた回数 */
function dayTotals(st,ds,now){var de=dayEnd(ds),o={};function g(k){return o[k]||(o[k]={ms:0,times:0,count:0});}
  st.entries.forEach(function(e){var m=clipMs(e,ds,de,now);if(m>0)g(e.kind).ms+=m;if(e.full&&e.end>=ds&&e.end<de)g(e.kind).times++;});
  st.counts.forEach(function(c){if(c.at>=ds&&c.at<de)g(c.kind).count++;});return o;}
function daySummary(st,ds,now){var t=dayTotals(st,ds,now),parts=[],ids=Object.keys(t);
  ids.forEach(function(id){var k=kindOf(st,id),v=t[id];if(k.type==='span'&&v.ms>=60000)parts.push(k.name+fmtHM(v.ms));
    else if(k.type==='fixed'&&v.ms>=60000)parts.push(k.name+fmtHM(v.ms)+(v.times?'（'+v.times+'回）':''));
    else if(k.type==='count'&&v.count)parts.push(k.name+v.count+unitOf(k));});
  var n=st.notes.filter(function(x){return x.at>=ds&&x.at<dayEnd(ds);}).length;
  if(n)parts.push('できたこと'+n+'つ');return parts.length?parts.join('・'):'';}
/* 週：記録ごとに 日数・合計・回数 */
function weekTotals(st,endDs,now){var o={};for(var i=6;i>=0;i--){var ds=dayStart(dayStart(endDs)-i*86400000+43200000),t=dayTotals(st,ds,now);
  Object.keys(t).forEach(function(k){var v=t[k],a=o[k]||(o[k]={days:0,ms:0,times:0,count:0});if(v.ms>0||v.count>0)a.days++;a.ms+=v.ms;a.times+=v.times;a.count+=v.count;});}return o;}
/* v2 の状態 {acts,entries,dayNotes,timer} を v3 の形へ写す（v2 は読むだけ） */
function migrateV2(v2){var st={v:3,kinds:[],entries:[],counts:[],notes:[]},seen={};
  (v2.acts||[]).forEach(function(a){st.kinds.push({id:'k'+a.id,type:'span',name:String(a.name||'名前なし'),hidden:false});seen['k'+a.id]=1;});
  st.kinds.push({id:'kn',type:'note',name:'できたこと',hidden:false});
  (v2.entries||[]).forEach(function(e){var kid='k'+e.act;if(!seen[kid]){st.kinds.push({id:kid,type:'span',name:'（消した活動）',hidden:true});seen[kid]=1;}
    st.entries.push({id:e.id,kind:kid,start:e.start,end:e.end==null?null:e.end,full:false});
    if(e.note)st.notes.push({id:'n'+e.id,at:e.start,text:String(e.note),kind:kid,entry:e.id});});
  var dn=v2.dayNotes||{};Object.keys(dn).forEach(function(d){var p=d.split('-');if(p.length===3&&dn[d])st.notes.push({id:'d'+d,at:new Date(+p[0],+p[1]-1,+p[2],12,0).getTime(),text:String(dn[d]),kind:null,entry:null});});
  return st;}
function backupText(st,now){return JSON.stringify({app:'jikan_v3',version:3,savedAt:now,data:st});}
function sid(x){return String(x==null?'':x).replace(/[^A-Za-z0-9_-]/g,'_').slice(0,40)||'_';}
function num(x,def){return typeof x==='number'&&isFinite(x)?x:def;}
/* 読んだ字を、決まりの形にそろえる（名前12字・呼び方4字・長さ1〜240・種類は4つのうち・id は英数字のみ） */
function sanitize(d){var o={v:3,kinds:[],entries:[],counts:[],notes:[],notice:d.notice===true};
  (d.kinds||[]).forEach(function(k){if(!k||typeof k!=='object')return;var t=TYPES[k.type]?k.type:'span',n={id:sid(k.id),type:t,name:String(k.name==null?'':k.name).trim().slice(0,12)||'名前なし',hidden:!!k.hidden};
    if(t==='fixed'){var m=parseInt(k.minutes,10);n.minutes=(m>=1&&m<=240)?m:25;}if(t==='count')n.unit=cleanUnit(k.unit);o.kinds.push(n);});
  (d.entries||[]).forEach(function(e){if(!e||typeof e.start!=='number')return;var n={id:sid(e.id),kind:sid(e.kind),start:e.start,end:typeof e.end==='number'?e.end:null,full:!!e.full};var p=parseInt(e.planned,10);if(p>=1&&p<=240)n.planned=p;o.entries.push(n);});
  (d.counts||[]).forEach(function(c){if(!c||typeof c.at!=='number')return;o.counts.push({id:sid(c.id),kind:sid(c.kind),at:c.at});});
  (d.notes||[]).forEach(function(n){if(!n||typeof n.at!=='number')return;o.notes.push({id:sid(n.id),at:n.at,text:String(n.text==null?'':n.text).slice(0,200),kind:n.kind?sid(n.kind):null,entry:n.entry?sid(n.entry):null});});
  return o;}
function validV3(d){return d&&Array.isArray(d.kinds)&&Array.isArray(d.entries)&&Array.isArray(d.counts)&&Array.isArray(d.notes)&&d.entries.every(function(e){return e&&typeof e.start==='number'&&typeof e.kind==='string';});}
function parseBackup(text){var j;try{j=JSON.parse(text);}catch(e){return{ok:false,error:'ファイルが読めません'};}
  if(j&&j.app==='jikan_v3'&&validV3(j.data))return{ok:true,state:sanitize(j.data),from:'v3'};
  if(j&&j.app==='jikan_no_kiroku'&&j.data&&Array.isArray(j.data.acts)&&Array.isArray(j.data.entries)&&j.data.entries.every(function(e){return e&&typeof e.start==='number'&&typeof e.act==='string';})){var m2=sanitize(migrateV2(j.data));m2.notice=true;return{ok:true,state:m2,from:'v2'};}
  return{ok:false,error:'この控えの形ではありません'};}
function validateEntryEdit(st,id,start,end,now){if(!(start>=0)||!(end>=0))return'時刻が読めません';if(end<=start)return'終わりは、始まりより後にしてください';if(end>now)return'未来の時刻にはできません';
  for(var i=0;i<st.entries.length;i++){var e=st.entries[i];if(e.id===id)continue;var t2=e.end==null?now:e.end;if(start<t2&&end>e.start)return'ほかの記録と重なっています';}return null;}
function deleteEntry(st,id){st.entries=st.entries.filter(function(e){return e.id!==id;});st.notes.forEach(function(n){if(n.entry===id)n.entry=null;});}
function moveKind(st,id,dir){var i=-1;st.kinds.forEach(function(k,j){if(k.id===id)i=j;});var j2=i+dir;if(i<0||j2<0||j2>=st.kinds.length)return false;var t=st.kinds[i];st.kinds[i]=st.kinds[j2];st.kinds[j2]=t;return true;}
function csvEsc(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function csvFor(st,from,to,now){var rows=[];function hmm(ms){var d=new Date(ms);return p2(d.getHours())+':'+p2(d.getMinutes());}
  st.entries.forEach(function(e){if(e.start>=from&&e.start<to){var k=kindOf(st,e.kind);rows.push([e.start,ymd(e.start),hmm(e.start),k.name,'時間',e.end==null?'':hmm(e.end),Math.round(((e.end==null?now:e.end)-e.start)/60000),e.full?'決めた時間を終えた':'']);}});
  st.counts.forEach(function(c){if(c.at>=from&&c.at<to)rows.push([c.at,ymd(c.at),hmm(c.at),kindOf(st,c.kind).name,'回数','',1,'']);});
  st.notes.forEach(function(n){if(n.at>=from&&n.at<to)rows.push([n.at,ymd(n.at),hmm(n.at),n.kind?kindOf(st,n.kind).name:'そのほか','できたこと','','',n.text]);});
  rows.sort(function(a,b){return a[0]-b[0];});
  return ['日付,時刻,記録,種類,終わり,分または回,メモ'].concat(rows.map(function(r){return [r[1],r[2],r[3],r[4],r[5],r[6],r[7]].map(csvEsc).join(',');})).join('\n');}
function mainKinds(st){return st.kinds.filter(function(k){return !k.hidden;});}
function btnLabel(st,k,now){var r=runningEntry(st);
  if(k.type==='note')return k.name+'を書く';
  if(k.type==='count')return k.name+'　＋1';
  var verb=k.type==='fixed'?k.name+'を'+k.minutes+'分始める':k.name+'をはかる';
  if(r&&r.kind===k.id)return k.name+'を終える';
  if(r)return kindOf(st,r.kind).name+'を終えて、'+verb;
  return verb;}
/* ===== 計算ここまで ===== */
if(typeof document!=='undefined'){
var demo=/[?&]demo=1/.test(location.search),KEY=demo?'jikan_v3_demo':'jikan_v3';
var st,tab='rec',sub=null,addType='span',pend=null,alarmMsg='',more=false,setMsg='',pendingBk=null,addName='副業',addMin='25',addUnit='',revMode='day',revDay=null,ntext='',showList=false,edit=null,delAsk=false,csvText='';
if(/[?&]mode=week/.test(location.search))revMode='week';
var aq=location.search.match(/[?&]addtype=(span|fixed|count|note)/);if(aq){sub='add';addType=aq[1];addName=EXAMPLE[addType];}
var an=location.search.match(/[?&]addname=([^&]*)/);if(an)addName=decodeURIComponent(an[1]);var am=location.search.match(/[?&]addmin=(\d+)/);if(am)addMin=am[1];
var tq=location.search.match(/[?&]tab=(rec|rev|set)/);if(tq)tab=tq[1];var sq=location.search.match(/[?&]sub=(add|note)/);if(sq)sub=sq[1];
function save(){try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}}
function load(){try{var j=JSON.parse(localStorage.getItem(KEY));if(validV3(j))return sanitize(j);}catch(e){}return null;}
function loadV2(){try{var j=JSON.parse(localStorage.getItem('jikan_v1'));if(j&&Array.isArray(j.acts)&&Array.isArray(j.entries))var m3=sanitize(migrateV2(j));m3.notice=true;return m3;}catch(e){}return null;}
function makeDemo(){var now=Date.now(),s=newState();s.kinds.push({id:'k4',type:'count',name:'解いた問題',unit:'問',hidden:false});
  function mk(back,h,m){var d=new Date(dayStart(now)-back*86400000+43200000);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m).getTime();}
  function E(k,a,b,full,pl){if(a>=now)return;var e={id:uid(),kind:k,start:a,end:Math.min(b,now),full:full&&b<=now};if(pl)e.planned=pl;s.entries.push(e);return e;}
  function N(at,t,k){if(at<now)s.notes.push({id:uid(),at:at,text:t,kind:k,entry:null});}
  function C(at){if(at<now)s.counts.push({id:uid(),kind:'k4',at:at});}
  E('k1',mk(0,7,0),mk(0,7,45));N(mk(0,7,46),'見積もりを1件送った','k1');
  E('k2',mk(0,8,0),mk(0,8,25),true,25);E('k2',mk(0,12,0),mk(0,12,25),true,25);N(mk(0,12,26),'第3章を読み終えた','k2');
  C(mk(0,8,30));C(mk(0,8,31));C(mk(0,12,30));
  [1,2].forEach(function(d){E('k1',mk(d,20,0),mk(d,20,50));N(mk(d,20,51),'ページの文を直した','k1');E('k2',mk(d,21,0),mk(d,21,25),true,25);C(mk(d,21,30));C(mk(d,21,31));});
  s.entries.push({id:uid(),kind:'k1',start:now-18*60000,end:null,full:false});return s;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function hm(ms){var d=new Date(ms);return p2(d.getHours())+':'+p2(d.getMinutes());}
function dstr(ms){var d=new Date(ms);return (d.getMonth()+1)+'月'+d.getDate()+'日';}
var INTRO='<div class="card intro"><div class="muted">記録は、この端末の中だけに残ります。</div><div class="muted">下の3つは、見本のボタンです。押すと、そのまま記録が始まります。名前を変えたり、自分のボタンを作ったりできます。</div></div>';

function subText(k,t){var r=runningEntry(st),inc=r&&r.kind===k.id?'（今回を含む）':'';if(k.type==='count')return 'きょうの合計 '+t.count+unitOf(k);if(k.type==='fixed'||k.type==='span')return 'きょうの合計 '+fmtHM(t.ms)+(k.type==='fixed'&&t.times?'（'+t.times+'回）':'')+inc;return '';}
function vRec(now){
  var r=runningEntry(st),h='',ds=dayStart(now),ks=mainKinds(st),top=ks.slice(0,4),rest=ks.slice(4);
  h+='<div class="top"><h1>時間とできたこと</h1><span>'+dstr(now)+'</span></div><div class="muted" style="margin:-2px 0 8px">何にどれだけ時間を使い、何ができたかを、毎日残せます。</div>';
  if(st.notice===true)h+='<div class="card intro"><div>'+esc('前の版の記録を、そのまま引き継ぎました（前の記録は消していません）。ボタンの名前は、設定で変えられます。自分のボタンも作れます。')+'</div><button class="sm" data-do="noticeclose" style="margin-top:8px">閉じる</button></div>';
  if(alarmMsg)h+='<div class="alarm">'+esc(alarmMsg)+' <button class="sm" data-do="ack">とじる</button></div>';
  var empty=!st.entries.length&&!st.counts.length&&!st.notes.length;if(empty)h+=INTRO;

function kindRows(ids,t,nsBy){return ids.map(function(i){var k=kindOf(st,i),v=t[i],line='';
  if(v)line=esc(k.type==='count'?v.count+unitOf(k):k.type==='fixed'?fixedLine(st,k,revDay,Date.now(),v):fmtHM(v.ms));
  return '<div class="row"><b>'+esc(k.name)+'</b><span>'+line+'</span></div>'+(nsBy[i]||[]).map(noteLine).join('');}).join('');}
function noteLine(n){return '<div class="row" style="padding-left:14px"><span><span class="muted" style="font-size:13px">できたこと　</span>'+hm(n.at)+'　'+esc(n.text)+'</span><button class="sm" data-do="enote" data-id="'+n.id+'" aria-label="できたことを直す：'+esc(n.text)+'">直す</button></div>';}
function vRev(now){if(!revDay)revDay=dayStart(now);var h='<div class="top"><h2>ふりかえり</h2><span class="flex"><button class="sm" data-do="rmode" data-id="day"'+(revMode==='day'?' style="background:#222;color:#fff"':'')+'>日</button><button class="sm" data-do="rmode" data-id="week"'+(revMode==='week'?' style="background:#222;color:#fff"':'')+'>週</button></span></div>';

  if(revMode==='day'){var t=dayTotals(st,revDay,now),tot=0,ns=st.notes.filter(function(n){return n.at>=revDay&&n.at<dayEnd(revDay);}).sort(function(a,b){return a.at-b.at;}),by={},oth=[];

    var ns2=st.notes.filter(function(n){return n.at>=ws&&n.at<dayEnd(revDay);}).sort(function(a,b){return a.at-b.at;});
    h+='<div class="card"><b>できたこと</b>'+(ns2.length?ns2.map(function(n){return '<div class="row"><span>'+dstr(n.at)+'　'+esc(n.text)+'</span></div>';}).join(''):'<div class="muted">まだありません。</div>')+'</div>';}
  return h;}
function vEditE(now){var h='<div class="flex"><button class="sm" data-do="ecancel">‹ 戻る</button><h2>直す</h2></div><div class="card">';

function vSet(now){var h='<h2>設定</h2><div class="card"><b>この道具について</b><p>何にどれだけ時間を使い、何ができたかを、毎日残せます。記録は、この端末の中だけに残ります。</p><div class="muted">記録のしかたは4つ。使った時間をはかる（始めと終わりを残す）／決めた時間をはかる（終えた回数と合計の時間を残す）／回数を数える（押すたびに＋1）／できたことを書く（日付の付いた1行）。「記録」の画面の「自分の記録ボタンを作る」で、自分で作れます。</div></div>';
  h+='<div class="card"><b>記録のしかた</b><div class="muted">名前はここで直せます。画面に出るのは4つまで（上から）。5つ目からは「ほかの記録」に入ります。</div>'+st.kinds.map(function(k,i){return '<div style="margin:10px 0;padding-bottom:8px;border-bottom:1px solid #eee"><input data-nm="'+k.id+'" maxlength="12" value="'+esc(k.name)+'" aria-label="記録の名前（'+TYPES[k.type]+'）"><div class="muted">'+TYPES[k.type]+(k.hidden?'・隠している':'')+'</div>'+(k.type==='fixed'?'<label>何分はかる？<input data-mn="'+k.id+'" type="number" min="1" max="240" inputmode="numeric" aria-label="'+esc(k.name)+'の長さ（分）" value="'+k.minutes+'"></label>':'')+(k.type==='count'?'<label>数える物の呼び方<input data-un="'+k.id+'" maxlength="4" aria-label="'+esc(k.name)+'の呼び方" value="'+esc(unitOf(k))+'"></label>':'')+'<div class="flex"><button class="sm" data-do="kup" data-id="'+k.id+'" aria-label="'+esc(k.name)+'を上へ"'+(i===0?' disabled':'')+'>上へ</button><button class="sm" data-do="kdown" data-id="'+k.id+'" aria-label="'+esc(k.name)+'を下へ"'+(i===st.kinds.length-1?' disabled':'')+'>下へ</button><button class="sm" data-do="hide" data-id="'+k.id+'">'+(k.hidden?'出す':'隠す')+'</button></div></div>';}).join('')+'</div>';
  h+='<div class="card"><b>控え（消えない為に）</b><div class="muted">全部を1つのファイルにします。古い版の控えも戻せます。</div><div class="flex"><button class="sm" data-do="bk">控えを書き出す</button><button class="sm" data-do="bkpick">控えから戻す</button></div><input id="bkfile" type="file" accept=".json,application/json" aria-label="控えのファイル" style="display:none">'+(pendingBk?'<div class="warn"><b>いまの記録を、この控えで置き換えます。よいですか？</b><br><button class="sm" data-do="bkgo" style="background:#c0392b;color:#fff">置き換える</button> <button class="sm" data-do="bkno">やめる</button></div>':'')+'</div>';

  if(demo)h+='<div class="card muted">いまは見本のデータです。</div>';return h;}

function render(){var now=Date.now(),a=document.getElementById('app'),body=edit?vEditE(now):sub==='add'?vAdd():tab==='rec'?vRec(now):tab==='rev'?vRev(now):vSet(now);

function download(name,text,type){try{var b=new Blob([text],{type:type+';charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(u);},2000);}catch(e){setMsg='保存できませんでした。';}}

function afterEnd(e,now){if(e){var k=kindOf(st,e.kind);ntext='';pend={title:k.name+'で、できたことを書く（飛ばせます）',kind:e.kind,entry:e.id,skip:true};}}
function checkDue(){var now=Date.now(),f=finishDue(st,now);if(!f)return;var k=kindOf(st,f.entry.kind);alarmMsg=f.lateMin>=1?k.name+'の'+f.entry.planned+'分は、'+f.lateMin+'分前に終わっていました。':k.name+'の'+f.entry.planned+'分が終わりました。';save();if(f.lateMin<1)beep();notify(alarmMsg);afterEnd(f.entry,now);render();}
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-do]');if(!b)return;var d=b.dataset.do,id=b.dataset.id,now=Date.now();

  else if(d==='bkgo'){var pr=parseBackup(pendingBk);if(pr.ok){st=pr.state;save();setMsg='控えから戻しました。';}else setMsg=pr.error;pendingBk=null;}

  else if(d==='edel'){if(edit.type==='note')st.notes=st.notes.filter(function(n){return n.id!==edit.id;});else deleteEntry(st,edit.id);edit=null;delAsk=false;save();}
  else if(d==='esave'){if(edit.type==='note'){var tx2=document.getElementById('etext').value.trim();if(!tx2){document.getElementById('eerr').textContent='空にはできません（消す時は「これを消す」）';return;}st.notes.forEach(function(n){if(n.id===edit.id)n.text=tx2.slice(0,200);});}
    else{var s1=new Date(document.getElementById('est').value).getTime(),e1=new Date(document.getElementById('een').value).getTime(),er3=validateEntryEdit(st,edit.id,s1,e1,now);if(er3){document.getElementById('eerr').textContent=er3;return;}
      st.entries.forEach(function(x){if(x.id===edit.id){x.start=s1;x.end=e1;x.kind=document.getElementById('ekind').value;x.full=x.full&&!!x.planned&&(e1-s1)>=x.planned*60000;}});}
